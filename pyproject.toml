[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-compliance-auditor"
version = "0.1.0"
description = "Audit an AWS account against a security baseline (public S3, unencrypted EBS, open security groups, IAM hygiene) and generate Markdown/HTML compliance reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DaveyD347" }]
keywords = ["aws", "security", "compliance", "boto3", "cis-benchmark", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = ["boto3>=1.34", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[ec2,s3,iam,rds,cloudtrail,sts]>=5.0", "ruff>=0.6"]

[project.scripts]
aws-audit = "aws_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/DaveyD347/aws-compliance-auditor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aws_auditor = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
